name: macOS Build

on:
  push:
    branches: [ master, upgrade ]
  pull_request:
    branches: [ master, upgrade ]
  workflow_dispatch:

env:
  VERSION: 0.7.31
  # Kept in sync with the git tags/commits pinned in packaging/net.sourceforge.openmortal.yml
  SDL_VERSION: 1.2.15
  SDL_IMAGE_VERSION: 1.2.12
  SDL_MIXER_VERSION: 1.2.12
  SDL_NET_VERSION: 1.2.8

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac (x86_64)
          - { runs-on: macos-13,     arch: x86_64 }
          # Apple Silicon (arm64) — macos-14+ runs on M-series hardware
          - { runs-on: macos-latest, arch: arm64  }

    runs-on: ${{ matrix.runs-on }}
    name: macOS ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools and codec libraries
        run: |
          brew update
          # Homebrew core dropped the sdl/sdl_image/sdl_mixer/sdl_net 1.2
          # formulas (only sdl12-compat, a runtime shim, remains). Build the
          # real SDL 1.2 stack from source below instead; just get the
          # toolchain and the codec libs it links against from Homebrew.
          brew install \
            autoconf automake libtool pkg-config \
            jpeg libpng giflib libvorbis libogg \
            freetype

      - name: Build SDL 1.2 stack from source
        run: |
          export HOMEBREW_PREFIX="$(brew --prefix)"
          export SDL_PREFIX="${HOME}/sdl12"
          echo "SDL_PREFIX=${SDL_PREFIX}" >> "$GITHUB_ENV"
          # Homebrew installs GNU libtool as glibtool(ize) to avoid clashing
          # with Apple's own /usr/bin/libtool; gnubin exposes the normal names.
          export PATH="${SDL_PREFIX}/bin:${HOMEBREW_PREFIX}/opt/libtool/libexec/gnubin:${HOMEBREW_PREFIX}/bin:$PATH"
          export PKG_CONFIG_PATH="${SDL_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/lib/pkgconfig"

          build_from_tag() {
            local repo="$1" tag="$2"
            curl -fsSL -o "/tmp/${repo}.tar.gz" \
              "https://github.com/libsdl-org/${repo}/archive/refs/tags/${tag}.tar.gz"
            mkdir -p "/tmp/${repo}"
            tar xzf "/tmp/${repo}.tar.gz" -C "/tmp/${repo}" --strip-components=1
            (
              cd "/tmp/${repo}"
              # SDL_image/mixer/net tags ship a pre-generated configure; only
              # bare SDL-1.2 needs autoreconf. Its configure.in references
              # AM_PATH_ALSA/AM_PATH_ESD from acinclude/, which plain
              # autoreconf won't find without -I (those backends aren't used
              # on macOS anyway — this just lets the macros expand).
              if [ ! -x ./configure ]; then
                # The checked-in ltmain.sh predates Homebrew's libtool,
                # causing "Version mismatch" at build time unless it's
                # regenerated to match first.
                libtoolize --force --copy
                # acinclude/ also ships its own vendored (2.2.6-era)
                # libtool.m4 for AM_PATH_ALSA/ESD's sake. aclocal searches
                # -I dirs in the order given, so without Homebrew's libtool
                # macro dir listed first, acinclude's stale copy wins and
                # the generated configure ends up with an LT_INIT from
                # libtool 2.2.6 while ltmain.sh (from libtoolize above) is
                # 2.6.2 -- "Version mismatch" at build time, reproduced on
                # Apple Silicon runners.
                autoreconf -i -f \
                  -I "${HOMEBREW_PREFIX}/opt/libtool/share/aclocal" \
                  -I acinclude
              else
                # A fresh git checkout can give configure.ac/Makefile.am a
                # timestamp that looks newer than the pre-generated
                # aclocal.m4/configure/Makefile.in, so make tries to
                # regenerate them with whatever autoconf is installed and
                # fails ("this file was generated for autoconf 2.61").
                # Touch them in dependency order so make treats them as
                # already up to date.
                touch aclocal.m4
                touch configure
                [ -f config.h.in ] && touch config.h.in
                find . -name 'Makefile.in' -exec touch {} +
              fi
              ./configure --prefix="${SDL_PREFIX}"
              make -j"$(sysctl -n hw.logicalcpu)"
              make install
            )
          }

          # SDL_image/mixer/net's configure scripts need sdl-config from a
          # completed SDL install, so these must build in order.
          build_from_tag SDL-1.2  "release-${{ env.SDL_VERSION }}"
          build_from_tag SDL_image "release-${{ env.SDL_IMAGE_VERSION }}"
          build_from_tag SDL_mixer "release-${{ env.SDL_MIXER_VERSION }}"
          build_from_tag SDL_net   "release-${{ env.SDL_NET_VERSION }}"

      - name: Configure
        run: |
          autoreconf -i -f
          # Use our freshly built SDL 1.2 + Homebrew prefixes so pkg-config
          # and sdl-config are found
          export HOMEBREW_PREFIX="$(brew --prefix)"
          # Homebrew installs GNU libtool as glibtool(ize) to avoid clashing
          # with Apple's own /usr/bin/libtool; gnubin exposes the normal names.
          export PATH="${SDL_PREFIX}/bin:${HOMEBREW_PREFIX}/opt/libtool/libexec/gnubin:${HOMEBREW_PREFIX}/bin:$PATH"
          export PKG_CONFIG_PATH="${SDL_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/lib/pkgconfig"
          export SDL_CONFIG="${SDL_PREFIX}/bin/sdl-config"

          ./configure \
            --prefix=/usr/local \
            SDL_CONFIG="${SDL_CONFIG}" \
            CXXFLAGS="-I${SDL_PREFIX}/include -I${HOMEBREW_PREFIX}/include -I${HOMEBREW_PREFIX}/include/freetype2" \
            LDFLAGS="-L${SDL_PREFIX}/lib -L${HOMEBREW_PREFIX}/lib"

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Install to staging dir
        run: make DESTDIR="$(pwd)/dist" install

      - name: Package
        run: |
          tar zcf "openmortal-${{ env.VERSION }}_macos_${{ matrix.arch }}.tar.gz" \
            -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openmortal-${{ env.VERSION }}_macos_${{ matrix.arch }}
          path: openmortal-${{ env.VERSION }}_macos_${{ matrix.arch }}.tar.gz
